<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f1115;
      font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #discord-widget {
      width: 100vw;
      height: 100vh;
      background-color: #23272a;
      color: #ffffff;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto;
    }

    .widget-header h3 {
      font-size: 2.2rem;
      font-weight: 700;
    }

    .stats-container {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }

    .stat-badge {
      font-size: 1.1rem;
      font-weight: 600;
      color: #57f287;
    }

    .stat-badge-total {
      font-size: 1.1rem;
      font-weight: 600;
      color: #eb459e;
    }

    /* Section Divider */
    .divider {
      height: 1px;
      background-color: rgba(255, 255, 255, 0.1);
      margin: 20px 0;
      width: 100%;
    }

    .members-wrapper {
      flex-grow: 1;
      overflow-y: auto;
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Section Headers */
    .section-title {
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .title-mods { color: #f1c40f; }
    .title-bots { color: #5865f2; }
    .title-members { color: #2ecc71; }

    .member-grid {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      align-content: start;
    }

    .member-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1.1rem;
    }

    .member-item img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }

    #invite-btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #5865f2;
      color: #fff;
      text-decoration: none;
      padding: 18px;
      border-radius: 8px;
      font-size: 1.25rem;
      font-weight: 700;
      transition: background-color 0.2s ease;
    }

    #invite-btn:hover {
      background-color: #4752c4;
    }
  </style>
</head>
<body>

  <!-- HTML Container -->
  <div id="discord-widget">
    <div class="widget-header">
      <h3 id="server-name">Loading...</h3>
      <div class="stats-container">
        <span class="stat-badge" id="online-count">0 Online</span>
        <span class="stat-badge-total" id="total-count-header">Total: --</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="members-wrapper">
      <!-- 1. MODERATORS -->
      <div>
        <div class="section-title title-mods">✨ ᴍᴏᴅᴇʀᴀᴛᴏrs ✨</div>
        <ul id="mod-list" class="member-grid"></ul>
      </div>

      <div class="divider"></div>

      <!-- 2. BOTS -->
      <div>
        <div class="section-title title-bots">🤖 ʙᴏᴛs 🤖</div>
        <ul id="bot-list" class="member-grid"></ul>
      </div>

      <div class="divider"></div>

      <!-- 3. ONLINE MEMBERS -->
      <div>
        <div class="section-title title-members">🌸 ᴏɴʟɪɴᴇ ᴍᴇᴍʙᴇʀs 🌸</div>
        <ul id="member-list" class="member-grid"></ul>
      </div>
    </div>

    <div class="divider"></div>

    <a id="invite-btn" href="#" target="_blank" rel="noopener">Join Server</a>
  </div>

  <!-- JavaScript Logic -->
  <script>
const MOD_ROLE_ID = "1528305985519751178";
const BOT_ROLE_ID = "1526913039457190050";

// How often to auto-refresh data (in milliseconds)
// 10000 = 10 seconds | 30000 = 30 seconds | 60000 = 1 minute
const REFRESH_INTERVAL = 1000; 

async function loadDiscordWidget() {
  // 1. Fetch server name and invite link from standard public widget
  try {
    const response = await fetch('https://discord.com/api/guilds/1508402330913996841/widget.json');
    const data = await response.json();
    document.getElementById('server-name').innerText = data.name;
    document.getElementById('online-count').innerText = `${data.presence_count} Online`;
    document.getElementById('invite-btn').href = data.instant_invite;
  } catch (e) {
    console.error('Error fetching standard widget data:', e);
  }

  // 2. Fetch full member roster & total count from Python backend
  try {
    const botResponse = await fetch('https://serverwidget.onrender.com/api/guild-data');
    const botData = await botResponse.json();

    if (botData.total_members !== undefined) {
      document.getElementById('total-count-header').innerText = `Total: ${botData.total_members}`;
    }

    const modList = document.getElementById('mod-list');
    const botList = document.getElementById('bot-list');
    const memberList = document.getElementById('member-list');

    modList.innerHTML = '';
    botList.innerHTML = '';
    memberList.innerHTML = '';

    botData.members.forEach(member => {
      if (member.status === 'offline') return;

      const li = document.createElement('li');
      li.className = 'member-item';

      const avatar = document.createElement('img');
      avatar.src = member.avatar_url;
      avatar.alt = member.username;

      const name = document.createElement('span');
      name.innerText = member.username;

      li.appendChild(avatar);
      li.appendChild(name);

      // Categorize by Discord Role IDs
      if (member.roles.includes(MOD_ROLE_ID)) {
        modList.appendChild(li);
      } else if (member.roles.includes(BOT_ROLE_ID) || member.bot) {
        botList.appendChild(li);
      } else {
        memberList.appendChild(li);
      }
    });

  } catch (e) {
    console.error('Error fetching bot server data:', e);
  }
}

// Initial load on page startup
loadDiscordWidget();

// Automatically re-run the function every 10 seconds
setInterval(loadDiscordWidget, REFRESH_INTERVAL);
  </script>

</body>
</html>
