<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Widget</title>
  
  <!-- Bakery / Sakura Favicon (Cupcake Emoji Icon) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧁</text></svg>">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Pacifico&family=Press+Start+2P&family=Quicksand:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fce4ec; /* Soft Sakura Pink */
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Outer Container - Two Column Grid */
    #widget-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 1100px;
      height: 85vh;
      background-color: #fff5f6;
      border: 4px solid #f8bbd0;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(216, 112, 147, 0.2);
    }

    /* LEFT SIDE: Widget Main */
    #discord-widget {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #ffffff;
      border-radius: 16px;
      padding: 20px;
      border: 2px solid #f48fb1;
      height: 100%;
      overflow: hidden;
    }

    /* Header Styling */
    .widget-header {
      text-align: center;
    }

    .widget-header h3 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #880e4f;
    }

    .stats-container {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 6px;
    }

    .stat-badge {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e91e63;
      background-color: #ffe0b2; /* Soft Bakery Cream */
      padding: 4px 10px;
      border-radius: 12px;
    }

    .stat-badge-total {
      font-size: 0.95rem;
      font-weight: 700;
      color: #d81b60;
      background-color: #f8bbd0;
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* Middle Description */
    .server-desc {
      font-style: italic;
      font-size: 0.85rem;
      color: #6d4c41; /* Warm Coffee/Bakery Brown */
      text-align: center;
      margin: 12px 0;
      line-height: 1.4;
    }

    .divider {
      height: 2px;
      background-color: #f8bbd0;
      margin: 8px 0;
      width: 100%;
    }

    /* Roster Lists */
    .members-wrapper {
      flex-grow: 1;
      overflow-y: auto;
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 6px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .title-mods { color: #d81b60; }
    .title-bots { color: #7b1fa2; }
    .title-members { color: #ad1457; }

    .member-grid {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .member-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #fff0f5;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      border: 1px solid #f8bbd0;
      color: #4a148c;
    }

    .member-item img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Invite Button */
    #invite-btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #f48fb1;
      color: #ffffff;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      transition: background-color 0.2s ease;
    }

    #invite-btn:hover {
      background-color: #ec407a;
    }

    /* RIGHT SIDE: Feature Cards */
    #right-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
    }

    .feature-card {
      flex: 1;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-decoration: none;
      transition: transform 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }

    .feature-card:hover {
      transform: translateY(-3px);
      filter: brightness(1.05);
    }

    /* Pixel Font for QOTD */
    .card-qotd {
      background-color: #ff6b6b;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 1.2rem;
    }

    .card-events {
  background-color: #d4e157;
  color: #33691e;
  font-family: 'Pacifico', cursive;
  font-size: 1.8rem;
}

.card-movies {
  background-color: #ba68c8;
  color: #ffffff;
  font-family: 'Fredoka', sans-serif;
  font-size: 1.6rem;
  letter-spacing: 1px;
}

    /* Responsive Mobile Layout */
    @media (max-width: 768px) {
      #widget-wrapper {
        grid-template-columns: 1fr;
        height: auto;
      }
      #right-panel {
        height: 300px;
      }
    }
  </style>
</head>
<body>

  <div id="widget-wrapper">
    <!-- LEFT SIDE WIDGET -->
    <div id="discord-widget">
      <div class="widget-header">
        <h3 id="server-name">キティクラムズ・ベーカリー</h3>
        <div class="stats-container">
          <span class="stat-badge" id="online-count">0 Online</span>
          <span class="stat-badge-total" id="total-count-header">Total: --</span>
        </div>
      </div>

      <!-- Middle Description -->
      <p class="server-desc">
        <i>Hello! Welcome to our webpage! We provide services such as QOTD, movie nights, events, and more! Come join us today!</i>
      </p>

      <div class="divider"></div>

      <!-- Member Lists -->
      <div class="members-wrapper">
        <div>
          <div class="section-title title-mods">🌸 ᴏɴʟɪɴᴇ ᴍᴏᴅᴇʀᴀᴛᴏʀs 🌸</div>
          <ul id="mod-list" class="member-grid"></ul>
        </div>

        <div class="divider"></div>

        <div>
          <div class="section-title title-bots">🍰 ᴏɴʟɪɴᴇ ʙᴏᴛs 🍰</div>
          <ul id="bot-list" class="member-grid"></ul>
        </div>

        <div class="divider"></div>

        <div>
          <div class="section-title title-members">✨ ᴏɴʟɪɴᴇ ᴍᴇᴍʙᴇʀs ✨</div>
          <ul id="member-list" class="member-grid"></ul>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Small Rectangular Button -->
      <a id="invite-btn" class="server-invite-link" href="https://discord.gg/rdcdZ56S4M" target="_blank" rel="noopener">Join Server</a>
    </div>

    <!-- RIGHT SIDE PANELS -->
    <div id="right-panel">
      <a class="feature-card card-qotd server-invite-link" href="https://discord.gg/rdcdZ56S4M" target="_blank" rel="noopener">QOTD</a>
      <a class="feature-card card-events server-invite-link" href="https://discord.gg/rdcdZ56S4M" target="_blank" rel="noopener">Events</a>
      <a class="feature-card card-movies server-invite-link" href="https://discord.gg/rdcdZ56S4M" target="_blank" rel="noopener">Movie-Nights</a>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
const MOD_ROLE_ID = "1528305985519751178";
const BOT_ROLE_ID = "1526913039457190050";
const REFRESH_INTERVAL = 10000; 

async function loadDiscordWidget() {
  try {
    const botResponse = await fetch('https://serverwidget.onrender.com/api/guild-data');
    const botData = await botResponse.json();

    if (botData.server_name) {
      document.getElementById('server-name').innerText = botData.server_name;
    }

    if (botData.total_members !== undefined) {
      document.getElementById('total-count-header').innerText = `Total: ${botData.total_members}`;
    }

    const modList = document.getElementById('mod-list');
    const botList = document.getElementById('bot-list');
    const memberList = document.getElementById('member-list');

    modList.innerHTML = '';
    botList.innerHTML = '';
    memberList.innerHTML = '';

    let onlineCount = 0;

    botData.members.forEach(member => {
      if (member.status === 'offline') return;

      onlineCount++;

      const li = document.createElement('li');
      li.className = 'member-item';

      const avatar = document.createElement('img');
      avatar.src = member.avatar_url;
      avatar.alt = member.username;

      const name = document.createElement('span');
      name.innerText = member.display_name || member.username;

      li.appendChild(avatar);
      li.appendChild(name);

      if (member.roles.includes(MOD_ROLE_ID)) {
        modList.appendChild(li);
      } else if (member.roles.includes(BOT_ROLE_ID) || member.bot) {
        botList.appendChild(li);
      } else {
        memberList.appendChild(li);
      }
    });

    document.getElementById('online-count').innerText = `${onlineCount} Online`;

  } catch (e) {
    console.error('Error fetching bot server data:', e);
  }
}

loadDiscordWidget();
setInterval(loadDiscordWidget, REFRESH_INTERVAL);
  </script>

</body>
</html>
